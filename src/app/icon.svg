<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0a0f1a"/>
  <!-- Paddle handle -->
  <rect x="292" y="330" width="44" height="120" rx="22" transform="rotate(-45 314 390)" fill="#1e3a5f"/>
  <rect x="296" y="334" width="36" height="112" rx="18" transform="rotate(-45 314 390)" fill="#2a4f80"/>
  <!-- Paddle face -->
  <ellipse cx="220" cy="220" rx="130" ry="130" fill="#00c8ff" opacity="0.15"/>
  <ellipse cx="220" cy="220" rx="130" ry="130" fill="none" stroke="#00c8ff" stroke-width="8" opacity="0.6"/>
  <ellipse cx="220" cy="220" rx="110" ry="110" fill="#0d1520"/>
  <ellipse cx="220" cy="220" rx="110" ry="110" fill="none" stroke="#1e3a5f" stroke-width="4"/>
  <!-- Paddle rubber (top half) -->
  <path d="M 110 220 A 110 110 0 0 1 330 220 Z" fill="#00c8ff" opacity="0.3"/>
  <path d="M 110 220 A 110 110 0 0 1 330 220 Z" fill="none" stroke="#00c8ff" stroke-width="2" opacity="0.5"/>
  <!-- Center line on paddle -->
  <line x1="110" y1="220" x2="330" y2="220" stroke="#00c8ff" stroke-width="3" opacity="0.4"/>
  <!-- Ball -->
  <circle cx="360" cy="140" r="44" fill="#0d1520" stroke="#00c8ff" stroke-width="3" opacity="0.8"/>
  <circle cx="360" cy="140" r="44" fill="none" stroke="#00c8ff" stroke-width="6" opacity="0.3"/>
  <circle cx="360" cy="140" r="32" fill="#ffffff" opacity="0.9"/>
  <!-- Ball sheen -->
  <circle cx="348" cy="128" r="10" fill="#ffffff" opacity="0.5"/>
  <!-- Neon glow on paddle outline -->
  <ellipse cx="220" cy="220" rx="130" ry="130" fill="none" stroke="#00c8ff" stroke-width="3" opacity="0.9" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
